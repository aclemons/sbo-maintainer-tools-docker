name: Docker build current

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - Dockerfile.current
      - build_sbo-maintainer-tools.sh

concurrency:
  group: docker-current-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: aclemons/sbo-maintainer-tools
  # renovate: datasource=github-releases depName=docker/buildx
  BUILDX_VERSION: "v0.36.1"

jobs:
  docker-current:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    environment:
      name: dockerhub
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Configure sbo-maintainer-tools version
        run: |
          grep ^SBO_MAINTAINER_TOOLS_VERSION build_sbo-maintainer-tools.sh  | sed 's/"//g' >> "$GITHUB_ENV"

      - name: Configure binfmt image
        run: |
          BINFMT_IMAGE="$(awk '/^FROM / {print $2}' binfmt/Dockerfile)"
          printf "BINFMT_IMAGE=%s\n" "$BINFMT_IMAGE" >> "$GITHUB_ENV"

      - name: Configure buildkit image
        run: |
          BUILDKIT_IMAGE="$(awk '/^FROM / {print $2}' buildkit/Dockerfile)"
          printf "BUILDKIT_IMAGE=%s\n" "$BUILDKIT_IMAGE" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: ${{ env.BINFMT_IMAGE }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0 # zizmor: ignore[cache-poisoning] trusted release workflow
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure immutable tag fields
        run: |
          BUILD_DATE="$(date -u +%Y%m%d)"
          BUILD_RUN="$(printf '%06d' "${GITHUB_RUN_NUMBER}")"
          BUILD_SHA="${GITHUB_SHA::12}"
          printf "IMMUTABLE_TAG=%s-current-%s-%s-sha%s\n" \
            "$SBO_MAINTAINER_TOOLS_VERSION" \
            "$BUILD_DATE" \
            "$BUILD_RUN" \
            "$BUILD_SHA" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest-current
            type=raw,value=${{ env.SBO_MAINTAINER_TOOLS_VERSION }}-current
            type=raw,value=${{ env.IMMUTABLE_TAG }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          pull: true
          push: true
          platforms: linux/386,linux/amd64,linux/arm64/v8
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: Dockerfile.current
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
